<title>どこしまった帳</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root{
    --bg:#F1F2EE; --surface:#FFFFFF; --surface-2:#F7F8F4;
    --ink:#1E211C; --muted:#6A6F63; --line:#D7D9D1; --line-strong:#B9BDB1;
    --accent:#C2552A; --accent-ink:#FFFFFF; --accent-soft:#F8E6DD;
    color-scheme:light;
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --bg:#171913; --surface:#1F221B; --surface-2:#262A21;
      --ink:#ECEDE5; --muted:#9AA091; --line:#30342B; --line-strong:#464B3F;
      --accent:#E8906A; --accent-ink:#2A1208; --accent-soft:#3A241A;
      color-scheme:dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#171913; --surface:#1F221B; --surface-2:#262A21;
    --ink:#ECEDE5; --muted:#9AA091; --line:#30342B; --line-strong:#464B3F;
    --accent:#E8906A; --accent-ink:#2A1208; --accent-soft:#3A241A;
    color-scheme:dark;
  }
  body{background:var(--bg);color:var(--ink);font-family:"Zen Kaku Gothic New",system-ui,-apple-system,"Hiragino Sans",sans-serif;font-size:16px;line-height:1.65;-webkit-text-size-adjust:100%}
  .wrap{max-width:640px;margin-inline:auto;padding-inline:16px;padding-block:24px 72px;display:flex;flex-direction:column;gap:22px}
  header{display:flex;flex-direction:column;gap:6px}
  .eyebrow{font-size:12px;letter-spacing:.12em;color:var(--muted);font-weight:500}
  h1{margin:0;font-size:30px;line-height:1.15;font-weight:700;text-wrap:balance}
  .lede{margin:0;color:var(--muted);font-size:14px}

  .search{position:relative}
  .search input{font:inherit;font-size:18px;padding:16px 16px;border-radius:12px;border:2px solid var(--accent);background:var(--surface);color:var(--ink);width:100%;box-sizing:border-box}
  .search input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
  .result{display:flex;flex-direction:column;gap:10px}
  .hit{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:grid;grid-template-columns:1fr auto;gap:6px 12px;align-items:start}
  .hit .name{font-weight:700;font-size:17px;overflow-wrap:anywhere}
  .hit .where{font-size:18px;font-weight:700;color:var(--accent);overflow-wrap:anywhere}
  .hit .where small{display:block;font-size:12.5px;font-weight:500;color:var(--muted)}
  .hit .sub{font-size:13px;color:var(--muted)}
  .hit img{max-width:100%;border-radius:6px;border:1px solid var(--line);margin-top:6px}
  .hit .foot{grid-column:1/-1;display:flex;justify-content:flex-end;gap:8px}
  .example-tag{font-size:11px;letter-spacing:.08em;color:var(--muted);border:1px dashed var(--line-strong);border-radius:4px;padding:1px 6px}

  .btn{font:inherit;font-weight:700;font-size:16px;padding:14px 18px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);cursor:pointer;width:100%}
  .btn:hover{filter:brightness(1.06)}
  .btn:focus-visible,.ghost:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
  .ghost{font:inherit;font-size:14px;padding:10px 14px;border-radius:8px;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);cursor:pointer}
  .ghost.small{padding:7px 10px;font-size:13px}
  .ghost.danger{color:#B03A2E;border-color:#B03A2E}
  .row-actions{display:flex;gap:8px;flex-wrap:wrap}

  .card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:12px}
  .card h2{margin:0;font-size:17px}
  .field{display:flex;flex-direction:column;gap:5px}
  .field label{font-size:13px;color:var(--muted);font-weight:500}
  input,select,textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--surface-2);border:1px solid var(--line-strong);border-radius:8px;padding:11px 12px;width:100%;box-sizing:border-box}
  input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:1px;border-color:var(--accent)}
  textarea{min-height:60px;resize:vertical}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  @media (max-width:420px){.two{grid-template-columns:1fr}}
  .hint{font-size:12.5px;color:var(--muted);margin:0}

  .group{display:flex;flex-direction:column;gap:8px}
  .group h3{margin:14px 0 2px;font-size:14px;color:var(--muted);font-weight:700;letter-spacing:.04em}
  .empty{border:1px dashed var(--line-strong);border-radius:10px;padding:18px 16px;color:var(--muted);font-size:14px;background:var(--surface-2)}
  .toast{min-height:1.4em;font-size:13.5px;color:#3C7A4C}
  .toast.err{color:#B03A2E}
  details{border:1px solid var(--line);border-radius:10px;background:var(--surface)}
  summary{cursor:pointer;padding:12px 16px;font-weight:700;list-style:none}
  summary::-webkit-details-marker{display:none}
  summary::before{content:"＋ ";color:var(--muted)}
  details[open] summary::before{content:"－ "}
  details .inner{padding:0 16px 16px;display:flex;flex-direction:column;gap:12px}
  footer{border-top:1px solid var(--line);padding-top:14px;color:var(--muted);font-size:13px;display:flex;flex-direction:column;gap:6px}
  footer strong{color:var(--ink)}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="wrap">
  <header>
    <div class="eyebrow">あれ、どこにしまった？</div>
    <h1>どこしまった帳</h1>
    <p class="lede">しまった場所を、しまったときに一言だけ書いておく。探すときは名前を打つだけ。</p>
  </header>

  <div class="search"><input id="q" placeholder="探すものの名前を打つ（例: 印鑑、予備の鍵、説明書）" autocomplete="off" inputmode="search"></div>
  <div class="result" id="result"></div>

  <button class="btn" id="open-add">しまった場所を書く</button>

  <div class="card" id="form-card" hidden>
    <h2 id="form-title">しまった場所を書く</h2>
    <div class="field"><label for="f-name">何をしまった？</label><input id="f-name" placeholder="例: 実印 / 車の予備キー / テレビの説明書"></div>
    <div class="two">
      <div class="field"><label for="f-room">どの部屋？</label><input id="f-room" list="rooms" placeholder="例: 寝室 / 玄関 / 台所"><datalist id="rooms"></datalist></div>
      <div class="field"><label for="f-spot">部屋のどこ？</label><input id="f-spot" list="spots" placeholder="例: 押入れ上段 左の箱 / 引き出し2段目"><datalist id="spots"></datalist></div>
    </div>
    <div class="field"><label for="f-photo">場所の写真（任意）</label><input id="f-photo" type="file" accept="image/*"><p class="hint">箱や引き出しを撮っておくと、探すときに迷いません。写真は小さくして保存します。</p></div>
    <div class="field"><label for="f-note">メモ（任意）</label><textarea id="f-note" placeholder="例: 青い巾着袋の中"></textarea></div>
    <div class="row-actions">
      <button class="btn" id="f-save" style="width:auto">保存する</button>
      <button class="ghost" id="f-cancel">やめる</button>
    </div>
    <div class="toast" id="toast" role="status"></div>
  </div>

  <section id="all"></section>

  <details>
    <summary>バックアップと復元</summary>
    <div class="inner">
      <p class="hint">記録はこの端末の中にだけあります。<strong>端末を替える前に必ずバックアップを。</strong></p>
      <div class="row-actions"><button class="ghost" id="bk-save">バックアップを保存する</button></div>
      <div class="field"><label for="bk-text">復元：保存したファイルの中身を貼り付けて「読み込む」</label><textarea id="bk-text" placeholder="{ ... }"></textarea></div>
      <div class="row-actions"><button class="ghost" id="bk-load">読み込む</button><button class="ghost danger" id="bk-clear">全部消す</button></div>
      <div class="toast" id="bk-toast" role="status"></div>
    </div>
  </details>

  <footer>
    <div><strong>このアプリについて。</strong>あなたの端末の中にだけ記録が置かれます。どこにも送られません。</div>
    <div>端末を替えたり、ブラウザのデータを消したりすると記録も消えます。バックアップは上から。</div>
  </footer>
</div>

<script>
(function(){
  "use strict";
  var KEY="doko-cho-v1";
  var $=function(id){return document.getElementById(id);};
  var state={items:[]};
  function load(){ try{var raw=localStorage.getItem(KEY); if(raw){var d=JSON.parse(raw); if(d&&Array.isArray(d.items)){state=d;return;}}}catch(e){} state={items:seed()}; }
  function save(){ try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){ toast("保存できませんでした。端末の容量を確認してください",true);} }
  function seed(){ return [
    {id:"ex1",name:"実印（例）",room:"寝室",spot:"タンス 一番上の引き出し・右",note:"例です。「消す」で削除できます",photo:"",ex:true},
    {id:"ex2",name:"車の予備キー（例）",room:"玄関",spot:"靴箱の上の小物入れ",note:"",photo:"",ex:true}
  ];}
  function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
  function esc(s){return String(s||"").replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
  function norm(s){return String(s||"").toLowerCase().replace(/\s+/g,"");}
  var toastEl=$("toast"); function toast(m,e){toastEl.className="toast"+(e?" err":"");toastEl.textContent=m;}

  function hitEl(it){
    var el=document.createElement("div"); el.className="hit";
    el.innerHTML='<div><div class="name">'+esc(it.name)+(it.ex?' <span class="example-tag">例</span>':'')+'</div>'+
      (it.note?'<div class="sub">'+esc(it.note)+'</div>':'')+(it.photo?'<img alt="場所の写真" src="'+it.photo+'">':'')+'</div>'+
      '<div class="where">'+esc(it.room)+'<small>'+esc(it.spot)+'</small></div>'+
      '<div class="foot"><button class="ghost small" data-act="edit" data-id="'+it.id+'">直す</button><button class="ghost small danger" data-act="del" data-id="'+it.id+'">消す</button></div>';
    return el;
  }
  function renderSearch(){
    var q=norm($("q").value); var r=$("result"); r.innerHTML="";
    if(!q) return;
    var hits=state.items.filter(function(i){return norm(i.name).indexOf(q)>=0||norm(i.note).indexOf(q)>=0||norm(i.room+i.spot).indexOf(q)>=0;});
    if(!hits.length){ var e=document.createElement("div"); e.className="empty"; e.textContent="「"+$("q").value+"」は見つかりません。まだ書いていないか、別の名前で登録しているかもしれません。"; r.appendChild(e); return; }
    hits.forEach(function(i){ r.appendChild(hitEl(i)); });
  }
  function renderAll(){
    var all=$("all"); all.innerHTML="";
    if(!state.items.length){ var e=document.createElement("div"); e.className="empty"; e.textContent="まだ何も書いていません。「しまった場所を書く」から、今日しまったものを1つ入れてみてください。"; all.appendChild(e); return; }
    var byRoom={}; state.items.forEach(function(i){ (byRoom[i.room||"（部屋なし）"]=byRoom[i.room||"（部屋なし）"]||[]).push(i); });
    Object.keys(byRoom).sort().forEach(function(room){
      var g=document.createElement("div"); g.className="group";
      var h=document.createElement("h3"); h.textContent=room+"（"+byRoom[room].length+"）"; g.appendChild(h);
      byRoom[room].sort(function(a,b){return a.name.localeCompare(b.name,"ja");}).forEach(function(i){ g.appendChild(hitEl(i)); });
      all.appendChild(g);
    });
    var rooms=$("rooms"), spots=$("spots"); rooms.innerHTML=""; spots.innerHTML="";
    var seenR={},seenS={};
    state.items.forEach(function(i){ if(i.room&&!seenR[i.room]){seenR[i.room]=1;var o=document.createElement("option");o.value=i.room;rooms.appendChild(o);} if(i.spot&&!seenS[i.spot]){seenS[i.spot]=1;var p=document.createElement("option");p.value=i.spot;spots.appendChild(p);} });
  }
  function render(){ renderAll(); renderSearch(); }
  $("q").addEventListener("input",renderSearch);

  var editing=null,pendingPhoto="";
  function openForm(it){
    editing=it||null; $("form-title").textContent=it?"書き直す":"しまった場所を書く";
    $("f-name").value=it?it.name:""; $("f-room").value=it?it.room:""; $("f-spot").value=it?it.spot:""; $("f-note").value=it?it.note:""; $("f-photo").value=""; pendingPhoto=it?it.photo:"";
    $("form-card").hidden=false; $("open-add").hidden=true; toast(""); $("f-name").focus();
  }
  function closeForm(){ $("form-card").hidden=true; $("open-add").hidden=false; editing=null; }
  $("open-add").addEventListener("click",function(){openForm(null);});
  $("f-cancel").addEventListener("click",closeForm);
  $("f-photo").addEventListener("change",function(){
    var f=this.files&&this.files[0]; if(!f) return; var img=new Image(); var url=URL.createObjectURL(f);
    img.onload=function(){ var max=800,w=img.width,h=img.height,r=Math.min(1,max/Math.max(w,h)); var c=document.createElement("canvas"); c.width=Math.round(w*r); c.height=Math.round(h*r); c.getContext("2d").drawImage(img,0,0,c.width,c.height); pendingPhoto=c.toDataURL("image/jpeg",0.7); URL.revokeObjectURL(url); toast("写真を読み込みました"); };
    img.onerror=function(){toast("写真を読み込めませんでした",true);}; img.src=url;
  });
  $("f-save").addEventListener("click",function(){
    var name=$("f-name").value.trim(), room=$("f-room").value.trim(), spot=$("f-spot").value.trim();
    if(!name){toast("何をしまったか入れてください",true);return;}
    if(!room&&!spot){toast("部屋か場所を、どちらかは入れてください",true);return;}
    var rec={id:editing?editing.id:uid(),name:name,room:room,spot:spot,note:$("f-note").value.trim(),photo:pendingPhoto||"",ex:false};
    if(editing){state.items=state.items.map(function(i){return i.id===editing.id?rec:i;});} else {state.items.push(rec);}
    save(); render(); closeForm();
  });
  document.addEventListener("click",function(ev){
    var b=ev.target.closest("button[data-act]"); if(!b) return;
    var it=state.items.find(function(i){return i.id===b.dataset.id;}); if(!it) return;
    if(b.dataset.act==="edit"){ openForm(it); window.scrollTo({top:0,behavior:"smooth"}); }
    if(b.dataset.act==="del"){ if(confirm("「"+it.name+"」を消しますか？")){ state.items=state.items.filter(function(i){return i.id!==it.id;}); save(); render(); } }
  });

  var bkToast=$("bk-toast"); function bt(m,e){bkToast.className="toast"+(e?" err":"");bkToast.textContent=m;}
  var downloads=null;
  function fallback(text){ $("bk-text").value=text; bt("この端末では直接保存できないので、下の欄に出しました。全部コピーして保管してください"); }
  $("bk-save").addEventListener("click",function(){
    var text=JSON.stringify({app:"doko-cho",v:1,items:state.items.filter(function(i){return !i.ex;})},null,1);
    var fn="doko-cho-"+new Date().toISOString().slice(0,10)+".json";
    if(downloads){ downloads.save({filename:fn,data:text}).then(function(){bt("保存しました: "+fn);}).catch(function(){fallback(text);}); } else fallback(text);
  });
  $("bk-load").addEventListener("click",function(){
    try{ var d=JSON.parse($("bk-text").value); if(!d||!Array.isArray(d.items)) throw 0;
      var real=state.items.filter(function(i){return !i.ex;}); var ids={}; real.forEach(function(i){ids[i.id]=1;});
      d.items.forEach(function(i){ if(!ids[i.id]) real.push(i); }); state.items=real; save(); render(); bt(d.items.length+"件を読み込みました"); $("bk-text").value="";
    }catch(e){ bt("読み込めませんでした。バックアップの中身をそのまま貼り付けてください",true); }
  });
  $("bk-clear").addEventListener("click",function(){ if(confirm("すべての記録を消します。バックアップは取りましたか？")){state.items=[];save();render();bt("全部消しました");} });

  load(); render();
  if(window.claude&&typeof window.claude.use==="function"){ window.claude.use("downloads").then(function(ns){downloads=ns||null;}).catch(function(){}); }
})();
</script>
